plugins { id 'com.android.application' }

android {
  namespace 'com.carpenter.app'
  compileSdk 34

  defaultConfig {
    applicationId "com.carpenter.app"
    minSdk 24
    targetSdk 34
    // The workflow passes the run number, so every build installs over the last one.
    versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
    versionName System.getenv("VERSION_NAME") ?: "1.0"
    resValue "string", "repo_owner", (System.getenv("REPO_OWNER") ?: "idanzion9-ops")
    resValue "string", "repo_name", (System.getenv("REPO_NAME") ?: "Carpenter")
    resValue "string", "repo_branch", (System.getenv("REPO_BRANCH") ?: "main")
  }

  signingConfigs {
    release {
      // One permanent key, committed to the repo, so a new APK is always an
      // update to the installed app and never a fresh install.
      storeFile file(System.getenv("KEYSTORE_PATH") ?: "../keystore.jks")
      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "carpenter"
      keyAlias System.getenv("KEY_ALIAS") ?: "carpenter"
      keyPassword System.getenv("KEY_PASSWORD") ?: "carpenter"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
    debug {
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
